name: tchat

services:
  web:
    image: ${TGB_WEB_IMAGE:-ghcr.io/meanwebuser/telegram-tt-beauty-web}:${TGB_VERSION:-12.0.32}
    depends_on:
      telegram-proxy:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped

  telegram-proxy:
    image: ${TGB_PROXY_IMAGE:-ghcr.io/meanwebuser/telegram-tt-beauty-proxy}:${TGB_VERSION:-12.0.32}
    env_file:
      - ${TGB_PROXY_ENV_FILE:-./proxy.env}
    environment:
      LISTEN_HOST: 0.0.0.0
    expose:
      - "7777"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/proxy/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
