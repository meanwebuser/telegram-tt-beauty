services:
  web:
    build:
      context: .
      target: web
      args:
        TELEGRAM_API_ID: ${TELEGRAM_API_ID:?set TELEGRAM_API_ID in .env}
        TELEGRAM_API_HASH: ${TELEGRAM_API_HASH:?set TELEGRAM_API_HASH in .env}
    depends_on:
      telegram-proxy:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-127.0.0.1}:${WEB_PORT:-8080}:80"
    restart: unless-stopped

  telegram-proxy:
    build:
      context: .
      target: proxy
    env_file:
      - ./proxy/.env
    environment:
      LISTEN_HOST: 0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    expose:
      - "7777"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:7777/proxy/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
