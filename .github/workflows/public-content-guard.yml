name: Public content guard

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard:
    name: guard
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reject private identifiers and secrets
        shell: bash
        run: |
          set -euo pipefail

          # Keep repository-visible policy values encoded so forbidden private
          # identifiers are not reintroduced as literal text by this guard.
          encoded_patterns=(
            'YmV6cmFib3RueWk='
            'bWVnYW1lbjMy'
            'cm9vbWhhY2tlcg=='
            'dGcuYmV6cmFib3RueWkuY29t'
            'bGxtLmJlemJhcm9ib3RueWkuY29t'
            'd2hpc3Blci5iZXpyYWJvdG55aS5jb20='
            'MTkyLjE2OC4='
            'd2hpc3BlcnZlcg=='
          )

          violations=()
          for encoded in "${encoded_patterns[@]}"; do
            pattern="$(printf '%s' "$encoded" | base64 --decode)"
            while IFS= read -r path; do
              [[ -n "$path" ]] && violations+=("$path")
            done < <(git grep -I -i -l -F -- "$pattern" -- . ':!*.lock' ':(exclude)src/assets/**' ':(exclude)public/**' || true)
          done

          # RFC1918 addresses are forbidden in tracked public text. The
          # explicit patterns avoid broad matches against ordinary version data.
          while IFS= read -r path; do
            [[ -n "$path" ]] && violations+=("$path")
          done < <(git grep -I -E -l -- '(^|[^0-9])(10\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}|192\.168\.[0-9]{1,3}\.[0-9]{1,3}|172\.(1[6-9]|2[0-9]|3[01])\.[0-9]{1,3}\.[0-9]{1,3})([^0-9]|$)' -- . ':!*.lock' ':(exclude)src/assets/**' ':(exclude)public/**' || true)

          if ((${#violations[@]})); then
            printf '%s\n' "Public content guard failed in:" >&2
            printf '%s\n' "${violations[@]}" | sort -u >&2
            exit 1
          fi

          echo 'Public content guard passed.'

      - name: Scan for credential formats
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
